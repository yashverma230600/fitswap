kind = "web"
previewPath = "/"
title = "FITSWAP"
description = "A marketplace for buying and selling unused fitness memberships. Members can discover nearby gyms, sports, yoga, and swimming passes at a discount, while sellers recover value from memberships they cannot use."
version = "1.0.0"
id = "artifacts/fitswap"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24099

[services.development]
run = "pnpm --filter @workspace/fitswap run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fitswap", "run", "build" ]
serve = "static"
publicDir = "artifacts/fitswap/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24099"
BASE_PATH = "/"
